name: PrivacyPay Level 1 CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  verify:
    name: Level 1 Verification (Contract, Managed Outputs & Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          node scripts/setup-sdk-shims.js

      - name: Compile Compact Smart Contract
        run: npm run compile

      - name: Run Compact Contract Test Suite
        run: npm run test

      - name: Build Web Application
        run: npm run build
